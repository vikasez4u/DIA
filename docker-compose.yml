services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: dia-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - dia-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: dia-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
      - "8888:8888"   # Prometheus metrics
      - "8889:8889"   # Prometheus exporter metrics
    restart: unless-stopped
    networks:
      - dia-network

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: dia-jaeger
    ports:
      - "16686:16686" # Jaeger UI
      - "14250:14250" # gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - dia-network

  # Backend API Service
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: dia-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=false
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - OTEL_ENABLED=true
      - OTEL_SERVICE_NAME=dia-backend
      - OTEL_SERVICE_VERSION=1.0.0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_RESOURCE_ATTRIBUTES=service.name=dia-backend,service.version=1.0.0
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      - mysql
      - otel-collector
    restart: unless-stopped
    networks:
      - dia-network

  # Database backup service (optional)
  db-backup:
    image: mysql:8.0
    container_name: dia-db-backup
    volumes:
      - ./backups:/backups
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
    command: >
      sh -c "while true; do
        mysqldump -h mysql -u root -p${MYSQL_PASSWORD} ${MYSQL_DATABASE} > /backups/dia_backup_\$(date +%Y%m%d_%H%M%S).sql
        find /backups -name '*.sql' -type f -mtime +7 -delete
        sleep 86400
      done"
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - dia-network

  # Frontend Service (Angular)
  frontend:
    image: node:18-alpine
    container_name: dia-frontend
    working_dir: /app
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: >
      sh -c "npm install &&
             ng serve --host 0.0.0.0 --port 4200 --poll=2000"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - dia-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: dia-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - dia-network

volumes:
  backend_logs:
    driver: local
  mysql_data:
    driver: local
  node_modules:
    driver: local

networks:
  dia-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
